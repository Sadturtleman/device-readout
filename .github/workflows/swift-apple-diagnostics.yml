name: Swift Apple diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/swift-apple-diagnostics.yml'
      - 'tools/diagnostics/swift-apple-simulator.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimize:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build once and isolate the failing iOS Debug scenario
        run: bash tools/diagnostics/swift-apple-simulator.sh
      - name: Preserve diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swift-ios-debug-diagnostics
          path: .tools/apple-diagnostics/*.log
          include-hidden-files: true
          retention-days: 14
