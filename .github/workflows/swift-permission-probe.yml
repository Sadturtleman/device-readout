name: Temporary Swift permission stall diagnosis
on:
  pull_request:
    paths:
      - 'swift/**'
      - 'tools/swift-native-consumer/**'
      - 'tools/probe-swift-permissions.py'
      - 'tools/probe-swift-fresh-suites.py'
      - '.github/workflows/swift-permission-probe.yml'
permissions:
  contents: read
jobs:
  permission-probe:
    if: github.head_ref == 'diagnose/swift-permission-context'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Replay permission lifecycles in a separate public consumer
        run: python3 tools/probe-swift-permissions.py
      - name: Sample stalled fresh full suites without phase tracing
        run: python3 tools/probe-swift-fresh-suites.py
      - name: Preserve bounded reproduction logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: swift-permission-probe
          path: .tools/permission-probe/*.log
          include-hidden-files: true
          retention-days: 14
